version: "3.8"

services:
  # ─────────────────────────────────────────────
  # Main aggregator service (consumer + API)
  # ─────────────────────────────────────────────
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uts-aggregator
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=INFO
      - SQLITE_DB_PATH=data/dedup.db
      - QUEUE_MAX_SIZE=20000
    volumes:
      - aggregator-data:/app/data
    networks:
      - internal
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Publisher simulator (sends events with duplicates)
  # ─────────────────────────────────────────────
  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uts-publisher
    entrypoint: ["python", "-m", "src.simulator"]
    environment:
      - AGGREGATOR_URL=http://aggregator:8080
      - TOTAL_EVENTS=5000
      - DUPLICATE_RATE=0.25
      - BATCH_SIZE=50
    depends_on:
      aggregator:
        condition: service_healthy
    networks:
      - internal

volumes:
  aggregator-data:
    driver: local

networks:
  internal:
    driver: bridge
